name: Build Telumia Windows MSI

on:
  push:
    branches:
      - codex/enhanced-foundation
    paths:
      - '.github/workflows/telumia-windows-msi.yml'
      - 'composeApp/**'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telumia-windows-msi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-msi:
    runs-on: windows-2022
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out source and Git LFS assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
            echo "Desktop runtime configuration is unavailable." >&2
            exit 1
          fi
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties
          for property_name in NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Desktop runtime configuration is missing a required property." >&2
              exit 1
            fi
          done

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          if (-not (Test-Path (Join-Path $webView2Root 'build\native\include\WebView2.h'))) {
            throw 'WebView2 SDK header is missing.'
          }
          if (-not (Test-Path (Join-Path $webView2Root 'build\native\x64\WebView2Loader.dll.lib'))) {
            throw 'WebView2 x64 loader library is missing.'
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Scene Info regression tests
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:desktopTest `
            --tests '*EmbeddedChapterSceneMetadataProviderTest' `
            --tests '*TimedMetadataTimelineTest' `
            --tests '*SceneInfoProjectionTest' `
            --tests '*EmbeddedChaptersTest' `
            --tests '*EmbeddedChapterDecoderTest' `
            --tests '*PlayerSceneInfoDesktopTest' `
            --tests '*DesktopSceneInfoPanelTest' `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            --no-configuration-cache `
            --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Scene Info tests failed: $LASTEXITCODE" }

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            '-Pcompose.desktop.packaging.checkJdkVendor=false' `
            --no-configuration-cache `
            --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed: $LASTEXITCODE" }
          $version = (Select-String -Path 'composeApp\Configuration\DesktopVersion.properties' -Pattern '^VERSION_NAME=(.+)$').Matches[0].Groups[1].Value
          $msi = "composeApp\build\compose\release-msis\Telumia-Windows-x64-$version.msi"
          if (-not (Test-Path $msi)) { throw "Expected MSI is missing: $msi" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content 'SHA256SUMS.txt' -Encoding ascii
          Get-Item $msi | Select-Object Name,Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: telumia-windows-x64-1.0.2-alpha.1
          path: |
            composeApp/build/compose/release-msis/Telumia-Windows-x64-1.0.2-alpha.1.msi
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
